name: Deploy documentation site

# Rebuilds and deploys docs-site/ to Azure Static Web Apps on any change under docs-site/
# (including the trailer video). Change the video in the repo -> the live site updates.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy docs site
    steps:
      - name: Checkout (with LFS for the video)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the static site
        run: |
          cd docs-site
          node _build.js
          rm -rf dist && mkdir dist
          # copy the built HTML + SVGs + config (everything except the _*.js source and README)
          find . -maxdepth 1 -type f ! -name '_*.js' ! -name 'README.md' -exec cp {} dist/ \;
          # copy media (poster + trailer video)
          cp -r media dist/media

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'docs-site/dist'
          output_location: ''
          skip_app_build: true
